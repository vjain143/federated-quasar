<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trino Rows Viewer</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial; margin: 24px; }
      table { border-collapse: collapse; width: 100%; margin-top: 16px; }
      th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
      th { background: #f5f5f5; }
      .controls { display: flex; gap: 8px; flex-wrap: wrap; }
      input, button { padding: 8px 10px; }
      .small { font-size: 12px; color: #666; }
      .ok { color: #0a7a0a; }
      .err { color: #b00020; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; background: #eee; margin-left: 6px; }
    </style>
  </head>
  <body>
    <h1>Trino Rows Viewer <span class="badge">read-only</span></h1>
    <div class="small">Edit `config/application.yaml` for defaults; use controls below to override.</div>
    <div class="controls">
      <input id="catalog" placeholder="catalog" value="hive" />
      <input id="schema" placeholder="schema" value="default" />
      <input id="table" placeholder="table" value="events" />
      <input id="limit" type="number" placeholder="limit" value="50" />
      <button id="load">Load</button>
      <button id="run">Run Wiring Job</button>
      <a class="small" href="/swagger" target="_blank">Swagger</a>
    </div>
    <div id="status"></div>
    <table id="rows">
      <thead><tr><th>#</th><th>id</th><th>producer_team</th><th>consumer_team</th></tr></thead>
      <tbody></tbody>
    </table>

    <script>
      async function fetchRows() {
        const c = document.getElementById('catalog').value;
        const s = document.getElementById('schema').value;
        const t = document.getElementById('table').value;
        const lim = document.getElementById('limit').value || 50;
        const res = await fetch(`/api/trino/rows?catalog=${encodeURIComponent(c)}&schema=${encodeURIComponent(s)}&table=${encodeURIComponent(t)}&limit=${lim}`);
        if (!res.ok) {
          document.getElementById('status').innerHTML = '<div class="err">Failed: ' + res.status + '</div>';
          return;
        }
        const data = await res.json();
        const tb = document.querySelector('#rows tbody');
        tb.innerHTML = '';
        data.forEach((row, i) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${i+1}</td><td>${row.id ?? ''}</td><td>${row.producerTeam ?? ''}</td><td>${row.consumerTeam ?? ''}</td>`;
          tb.appendChild(tr);
        });
        document.getElementById('status').innerHTML = '<div class="ok">Loaded ' + data.length + ' rows.</div>';
      }

      async function runJob() {
        const c = document.getElementById('catalog').value;
        const s = document.getElementById('schema').value;
        const t = document.getElementById('table').value;
        const lim = parseInt(document.getElementById('limit').value || '50', 10);
        const res = await fetch(`/api/job/run`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ catalog: c, schema: s, table: t, limit: lim })
        });
        const txt = await res.text();
        document.getElementById('status').innerHTML = res.ok
          ? '<div class="ok">' + txt + '</div>'
          : '<div class="err">Failed: ' + res.status + ' ' + txt + '</div>';
      }

      document.getElementById('load').addEventListener('click', fetchRows);
      document.getElementById('run').addEventListener('click', runJob);
      fetchRows();
    </script>
  </body>
</html>
