teams:
- name: team1
  mysql:
    driver: mariadb
    mode: KERBEROS_GSSAPI
    url: jdbc:mariadb://db1.example.com:3306/team1_db
    user: team1_user
    password: ''
    gssService: mariadb
    useTicketCache: true
    extras:
      useSsl: 'true'
  schema: team1_db
  tables:
    producerTable: items
    consumerTable: items_ingest
