apiVersion: apps/v1
kind: Deployment
metadata:
  name: moat
  namespace: aix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moat
  template:
    metadata:
      labels:
        app: moat
    spec:
      initContainers:
        - name: seed-connectors
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /opt/moat/runtime/connectors
              mkdir -p /opt/policies/trino
              for f in /seed-connectors/*; do
                [ -f "$f" ] || continue
                cp "$f" /opt/moat/runtime/connectors/
              done
              for f in /seed-trino/*; do
                [ -f "$f" ] || continue
                cp "$f" /opt/policies/trino/
              done
          volumeMounts:
            - name: moat-runtime-config
              mountPath: /opt/moat/runtime
            - name: moat-policy-config
              mountPath: /opt/policies
            - name: moat-connector-seed
              mountPath: /seed-connectors
              readOnly: true
            - name: moat-config-trino-policy
              mountPath: /seed-trino
              readOnly: true
        - name: init-db
          image: moat/moat:0.22.2
          imagePullPolicy: IfNotPresent
          command: ["/app/entrypoint.sh"]
          args: ["migrate", "upgrade"]
          envFrom:
            - secretRef:
                name: moat-env-secret
          env:
            - name: CONFIG_FILE_PATH
              value: "/opt/moat/config.yaml"
          volumeMounts:
            - name: moat-api-config
              mountPath: /opt/moat
      containers:
        - name: api
          image: moat/moat:0.22.2
          imagePullPolicy: IfNotPresent
          command: ["/app/entrypoint.sh"]
          args: ["start-server"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: moat-env-secret
          env:
            - name: CONFIG_FILE_PATH
              value: "/opt/moat/config.yaml"
          volumeMounts:
            - name: moat-api-config
              mountPath: /opt/moat
              readOnly: true
            - name: moat-policy-config
              mountPath: /opt/policies
              readOnly: true
            - name: bundle-storage
              mountPath: /opt/moat/bundles
            - name: moat-runtime-config
              mountPath: /opt/moat/runtime
        - name: worker
          image: moat/moat:0.22.2
          imagePullPolicy: IfNotPresent
          command: ["/app/entrypoint.sh"]
          args: ["start-worker"]
          envFrom:
            - secretRef:
                name: moat-env-secret
          env:
            - name: CONFIG_FILE_PATH
              value: "/opt/moat/config.yaml"
          volumeMounts:
            - name: moat-api-config
              mountPath: /opt/moat
              readOnly: true
            - name: moat-policy-config
              mountPath: /opt/policies
              readOnly: true
            - name: bundle-storage
              mountPath: /opt/moat/bundles
            - name: moat-runtime-config
              mountPath: /opt/moat/runtime
      volumes:
        - name: moat-api-config
          configMap:
            name: moat-api-config
        - name: moat-config-trino-policy
          configMap:
            name: moat-config-trino-policy
        - name: moat-policy-config
          emptyDir: {}
        - name: bundle-storage
          emptyDir: {}
        - name: moat-runtime-config
          emptyDir: {}
        - name: moat-connector-seed
          configMap:
            name: moat-connector-seed
