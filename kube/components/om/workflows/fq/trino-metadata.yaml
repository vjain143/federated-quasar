source:
  type: trino
  serviceName: fq_trino
  serviceConnection:
    config:
      type: Trino
      hostPort: fq-trino.fq.svc.cluster.local:8080
      username: openmetadata
      catalog: hms_db
      # Keep this open during initial setup, then narrow down.
      databaseSchema: fq_dbt
      connectionOptions: {}
      connectionArguments: {}
  sourceConfig:
    config:
      type: DatabaseMetadata
      schemaFilterPattern:
        includes:
          - fq_dbt
      tableFilterPattern:
        includes:
          - fq_orders_v2
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://om-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "<OM_JWT_TOKEN>"
