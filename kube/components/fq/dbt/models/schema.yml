version: 2

models:
  - name: fq_orders
    description: "Demo model created by dbt in Trino for metadata-driven policy enforcement."
    meta:
      policy_domain: enterprise
      policy_sensitivity: confidential
      policy_owner_team: finance-analytics
    columns:
      - name: order_id
        tests:
          - not_null
  - name: fq_orders_summary
    description: "Summary model built from fq_orders for reporting and policy demos."
    meta:
      policy_domain: enterprise
      policy_sensitivity: confidential
      policy_owner_team: finance-analytics
    columns:
      - name: business_domain
        tests:
          - not_null
      - name: total_orders
        tests:
          - not_null
