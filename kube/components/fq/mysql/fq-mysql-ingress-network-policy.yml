apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fq-allow-internal-traffic-to-mysql
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [ fq-hms, fq-minio, fq-mysql, fq-trino-coordinator, superset, openmetadata, trino-gateway ] }
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.1.0.0/24
      ports:
        - protocol: TCP
          port: 9083
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 8080
