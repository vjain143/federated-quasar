event-listener.name=openlineage
openlineage.url=http://your-openlineage-backend:5000
openlineage.namespace=trino
openlineage.job-name=trino_query
openlineage.apiKey=your_api_key  # If required
openlineage.transport-type=http  # Other options: kafka, console, etc.
openlineage.kafka.bootstrap-servers=localhost:9092  # Only if using Kafka transport
openlineage.disabled=false
openlineage.timeout-ms=5000