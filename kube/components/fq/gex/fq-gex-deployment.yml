apiVersion: apps/v1
kind: Deployment
metadata:
  name: fq-gex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fq-gex
  template:
    metadata:
      labels:
        app: fq-gex
    spec:
      containers:
        - name: fq-gex
          image: fq-gex:1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fq-gex-config
            - secretRef:
                name: fq-gex-secrets
          resources:
            requests:
              cpu: 250m
              memory: 1024Mi
            limits:
              cpu: 1000m
              memory: 2048Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
