apiVersion: apps/v1
kind: Deployment
metadata:
  name: fq-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fq-minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: fq-minio
    spec:
      containers:
      - image: minio/minio:latest
        name: minio
        args:
          - server
          - /data
          - --console-address=:9001
        env:
          - name: MINIO_ROOT_USER
            value: minio
          - name: MINIO_ROOT_PASSWORD
            value: minio123
        ports: 
          - containerPort: 9001
            name: minio-console
        volumeMounts:
          - name: fq-minio-storage-volume
            mountPath: "/data"
      volumes:
        - name: fq-minio-storage-volume
          persistentVolumeClaim:
            claimName: fq-minio-pvc
