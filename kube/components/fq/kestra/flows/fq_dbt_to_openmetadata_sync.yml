id: fq_dbt_to_openmetadata_sync
namespace: fq.orchestration

description: >
  Trigger the governance orchestrator service to run dbt on Trino and ingest metadata into OpenMetadata.

inputs:
  - id: model_selector
    type: STRING
    defaults: fq_orders
  - id: trino_schema
    type: STRING
    defaults: fq_dbt
  - id: dbt_table_name
    type: STRING
    defaults: fq_orders_as_select

tasks:
  - id: run_governance_orchestrator
    type: io.kestra.plugin.core.http.Request
    uri: http://fq-governance-orchestrator.fq.svc.cluster.local:8080/run
    method: POST
    timeout: PT45M
    contentType: application/json
    options:
      allowFailed: true
      readTimeout: PT45M
    body: |
      {
        "model_selector": "{{ inputs.model_selector }}",
        "trino_schema": "{{ inputs.trino_schema }}",
        "dbt_table_name": "{{ inputs.dbt_table_name }}",
        "ingest_openmetadata": true
      }

  - id: assert_governance_orchestrator_success
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ outputs.run_governance_orchestrator.code == 200 }}"
      - "{{ outputs.run_governance_orchestrator.body.status == 'success' }}"
    errorMessage: "{{ outputs.run_governance_orchestrator.body }}"

  - id: log_orchestrator_response
    type: io.kestra.plugin.core.log.Log
    message: "{{ outputs.run_governance_orchestrator.body }}"
